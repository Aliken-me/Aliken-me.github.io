<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Rounded Container for Visibility in both Light & Dark Browser Tabs -->
  <rect width="64" height="64" rx="16" fill="#090d16"/>
  <rect width="64" height="64" rx="16" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Orbital Ring (Cyan Glow) -->
  <ellipse cx="32" cy="36" rx="26" ry="11" transform="rotate(-25 32 36)" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Bold Letter 'A' (Bright Clean White) -->
  <path d="M22 47L32 17L42 47M25.5 37H38.5" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Orbiting Satellite Node (Glowing Cyan Dot) -->
  <circle cx="12" cy="42" r="4.5" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="12" cy="42" r="1.5" fill="#ffffff"/>
</svg>
